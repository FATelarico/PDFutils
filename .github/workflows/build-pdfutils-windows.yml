name: build-pdfutils-windows

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-2025

    env:
      VCPKG_TARGET_TRIPLET: x64-windows

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: desktop
          cache: true

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress

          $NsisBin = "${env:ProgramFiles(x86)}\NSIS"
          if (Test-Path $NsisBin) {
            $NsisBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Set up vcpkg and install qpdf
        shell: pwsh
        run: |
          $VcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --depth 1 https://github.com/microsoft/vcpkg.git $VcpkgRoot

          & (Join-Path $VcpkgRoot 'bootstrap-vcpkg.bat')
          $VcpkgExe = Join-Path $VcpkgRoot 'vcpkg.exe'

          & $VcpkgExe install "qpdf:$env:VCPKG_TARGET_TRIPLET"
          "VCPKG_ROOT=$VcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        shell: pwsh
        run: |
          $Toolchain = Join-Path $env:VCPKG_ROOT 'scripts/buildsystems/vcpkg.cmake'

          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$Toolchain" `
            -DVCPKG_TARGET_TRIPLET=$env:VCPKG_TARGET_TRIPLET `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Package portable ZIP and installer EXE
        shell: pwsh
        working-directory: build
        run: |
          cpack --config CPackConfig.cmake -C Release --verbose

          Get-ChildItem -File *.zip,*.exe | Format-Table Name,Length

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PDFutils-windows-portable
          path: build/*.zip
          if-no-files-found: error

      - name: Upload installer EXE
        uses: actions/upload-artifact@v4
        with:
          name: PDFutils-windows-installer
          path: build/*.exe
          if-no-files-found: error
