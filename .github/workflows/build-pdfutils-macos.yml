name: build-pdfutils-macos

on:
  push:
    tags:
      - 'z*'        # runs on tags starting with z
  workflow_dispatch: 

jobs:
  build-macos:
    runs-on: macos-15

    env:
      VCPKG_TARGET_TRIPLET: arm64-osx

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: desktop
          cache: true
          # modules: 'qttools'

      # - name: Verify Qt LinguistTools
      #   shell: bash
      #   run: |
      #     set -euo pipefail
      #     test -x "$QT_ROOT_DIR/bin/lupdate"
      #     test -x "$QT_ROOT_DIR/bin/lrelease"
      #     find "$QT_ROOT_DIR" -name Qt6LinguistToolsConfig.cmake -print -quit | grep -q .
      #     "$QT_ROOT_DIR/bin/lupdate" -version
      #     "$QT_ROOT_DIR/bin/lrelease" -version

      - name: Set up vcpkg and install qpdf
        shell: pwsh
        run: |
          $VcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --depth 1 https://github.com/microsoft/vcpkg.git $VcpkgRoot

          bash (Join-Path $VcpkgRoot 'bootstrap-vcpkg.sh') -disableMetrics
          $VcpkgExe = Join-Path $VcpkgRoot 'vcpkg'

          & $VcpkgExe install "qpdf:$env:VCPKG_TARGET_TRIPLET"
          "VCPKG_ROOT=$VcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Diagnose vcpkg qpdf install
        shell: pwsh
        run: |
          $TripletRoot = Join-Path $env:VCPKG_ROOT "installed/$env:VCPKG_TARGET_TRIPLET"
      
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          Write-Host "VCPKG_TARGET_TRIPLET=$env:VCPKG_TARGET_TRIPLET"
          Write-Host "TripletRoot=$TripletRoot"
      
          & "$env:VCPKG_ROOT/vcpkg" list
      
          Get-ChildItem -Recurse $TripletRoot |
            Where-Object {
              $_.Name -match 'qpdf|libqpdf|qpdfConfig|qpdf-config|pkgconfig|\.pc$'
            } |
            Select-Object FullName

      - name: Configure
        shell: pwsh
        run: |
          $Toolchain = Join-Path $env:VCPKG_ROOT 'scripts/buildsystems/vcpkg.cmake'
          $TripletRoot = Join-Path $env:VCPKG_ROOT "installed/$env:VCPKG_TARGET_TRIPLET"
      
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$Toolchain" `
            -DVCPKG_TARGET_TRIPLET=$env:VCPKG_TARGET_TRIPLET `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR;$TripletRoot;$TripletRoot/lib/cmake/qpdf;$TripletRoot/share/qpdf" `
            -Dqpdf_DIR="$TripletRoot/lib/cmake/qpdf"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install staged files
        shell: pwsh
        run: |
          $StageDir = Join-Path $PWD 'stage'
          cmake --install build --config Release --prefix "$StageDir"

      - name: Upload staged install tree
        uses: actions/upload-artifact@v4
        with:
          name: PDFutils-macos
          path: stage/
