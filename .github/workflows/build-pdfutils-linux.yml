name: build-pdfutils-linux

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      package:
        description: 'Which Linux package(s) to build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - deb
          - rpm

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  FEDORA_IMAGE: fedora:44

jobs:
  package-linux-deb:
    name: Package Linux DEB (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || inputs.package == 'both' || inputs.package == 'deb'

    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu-24.04
            image: ubuntu:24.04
            artifact: PDFutils-linux-ubuntu-24.04-deb
            dist_dir: dist/deb/ubuntu-24.04

          - distro: debian-12
            image: debian:12
            artifact: PDFutils-linux-debian-12-deb
            dist_dir: dist/deb/debian-12

          - distro: debian-13
            image: debian:13
            artifact: PDFutils-linux-debian-13-deb
            dist_dir: dist/deb/debian-13

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Build DEB package inside target distro
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            "${{ matrix.image }}" \
            bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive

              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                cmake \
                ninja-build \
                pkg-config \
                qt6-base-dev \
                qt6-tools-dev \
                qt6-tools-dev-tools \
                libqpdf-dev \
                dpkg-dev \
                fakeroot \
                file \
                lintian \
                desktop-file-utils \
                ca-certificates

              rm -rf build-deb "${{ matrix.dist_dir }}"
              mkdir -p "${{ matrix.dist_dir }}"

              cmake -S . -B build-deb -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr

              cmake --build build-deb --parallel "$(nproc)"

              cpack \
                --config build-deb/CPackConfig.cmake \
                -G DEB \
                -C Release \
                -B "${{ matrix.dist_dir }}" \
                --verbose

              dpkg-deb --info "${{ matrix.dist_dir }}"/*.deb
              dpkg-deb --contents "${{ matrix.dist_dir }}"/*.deb

              apt-get install -y ./"${{ matrix.dist_dir }}"/*.deb

              command -v PDFutils-gui
              command -v PDFutils-cli

              ldd "$(command -v PDFutils-gui)"
              ldd "$(command -v PDFutils-cli)"

              lintian --fail-on error "${{ matrix.dist_dir }}"/*.deb
            '

      - name: Upload DEB package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.dist_dir }}/*.deb
          if-no-files-found: error

  package-linux-rpm:
    name: Package Linux RPM
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || inputs.package == 'both' || inputs.package == 'rpm'

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Build RPM package with CPack inside Fedora
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            "$FEDORA_IMAGE" \
            bash -euxo pipefail -c '
              dnf install -y \
                gcc \
                gcc-c++ \
                cmake \
                ninja-build \
                pkgconf-pkg-config \
                qt6-qtbase-devel \
                qt6-qttools-devel \
                qt6-linguist \
                qpdf-devel \
                rpm-build \
                rpmdevtools \
                file \
                desktop-file-utils

              cmake -S . -B build-rpm -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr

              cmake --build build-rpm --parallel "$(nproc)"

              mkdir -p dist/rpm

              cpack \
                --config build-rpm/CPackConfig.cmake \
                -G RPM \
                -C Release \
                -B dist/rpm \
                -D CPACK_RPM_PACKAGE_LICENSE=GPL-3.0-or-later \
                -D CPACK_RPM_PACKAGE_GROUP=Applications/Productivity \
                -D CPACK_RPM_PACKAGE_AUTOREQ=ON \
                --verbose

              ls -lah dist/rpm

              rpm -qip dist/rpm/*.rpm
              rpm -qlp dist/rpm/*.rpm | tee /tmp/pdfutils-rpm-contents.txt

              grep -E "/usr/share/applications/pdfutils\.desktop$" \
                /tmp/pdfutils-rpm-contents.txt

              grep -E "/usr/share/icons/hicolor/.*/apps/pdfutils\.(png|svg)$" \
                /tmp/pdfutils-rpm-contents.txt


              dnf install -y dist/rpm/*.rpm

              command -v PDFutils-gui
              command -v PDFutils-cli

              ldd "$(command -v PDFutils-gui)"
              ldd "$(command -v PDFutils-cli)"
            '

      - name: Upload RPM package
        uses: actions/upload-artifact@v4
        with:
          name: PDFutils-linux-rpm
          path: dist/rpm/*.rpm
          if-no-files-found: error
